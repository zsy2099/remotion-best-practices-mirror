name: Sync from ClawHub

on:
  schedule:
    # daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch all files from ClawHub upstream (@am-will/remotion-best-practices)
        env:
          BASE: 'https://clawhub.ai/api/v1/skills/remotion/file?ownerHandle=am-will&path='
        run: |
          set -uo pipefail
          FILES=(
            "SKILL.md"
            "rules/3d.md"
            "rules/animations.md"
            "rules/assets.md"
            "rules/assets/charts-bar-chart.tsx"
            "rules/assets/text-animations-typewriter.tsx"
            "rules/assets/text-animations-word-highlight.tsx"
            "rules/audio.md"
            "rules/calculate-metadata.md"
            "rules/can-decode.md"
            "rules/charts.md"
            "rules/compositions.md"
            "rules/display-captions.md"
            "rules/extract-frames.md"
            "rules/fonts.md"
            "rules/get-audio-duration.md"
            "rules/get-video-dimensions.md"
            "rules/get-video-duration.md"
            "rules/gifs.md"
            "rules/images.md"
            "rules/import-srt-captions.md"
            "rules/lottie.md"
            "rules/measuring-dom-nodes.md"
            "rules/measuring-text.md"
            "rules/sequencing.md"
            "rules/tailwind.md"
            "rules/text-animations.md"
            "rules/timing.md"
            "rules/transcribe-captions.md"
            "rules/transitions.md"
            "rules/trimming.md"
            "rules/videos.md"
          )
          failures=()
          for f in "${FILES[@]}"; do
            enc=$(printf '%s' "$f" | jq -sRr @uri)
            mkdir -p "$(dirname "$f")"
            ok=0
            for attempt in 1 2 3 4; do
              if curl -fsSL --max-time 30 "${BASE}${enc}" -o "$f"; then
                ok=1; break
              fi
              echo "  attempt $attempt failed for $f; sleeping $((attempt*5))s"
              sleep $((attempt*5))
            done
            if [ "$ok" -ne 1 ]; then
              failures+=("$f")
              echo "::error::Persistent fetch failure: $f"
            fi
          done
          if [ "${#failures[@]}" -gt 0 ]; then
            echo "::error::${#failures[@]} file(s) failed to fetch from ClawHub after retries. Rolling back working tree."
            git checkout HEAD -- .
            exit 1
          fi
          echo "Fetched ${#FILES[@]} files from ClawHub."

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No upstream changes; mirror is up to date."
          else
            git commit -m "chore: sync from ClawHub upstream (@am-will/remotion-best-practices)"
            git push
            echo "Mirror updated and pushed."
          fi